<svg viewBox="0 0 520 490" xmlns="http://www.w3.org/2000/svg" role="img">
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1f2328"/></marker></defs>
<style>
.box{fill:#fff;stroke:#1f2328;stroke-width:1.2}
.store{fill:#fff;stroke:#0969da;stroke-width:1.6}
.lbl{fill:#1f2328;font:600 14px sans-serif}
.sub{fill:#57606a;font:13px sans-serif}
.arr{stroke:#1f2328;stroke-width:1.4;fill:none;marker-end:url(#head)}
</style>
<rect width="100%" height="100%" fill="#fff"/>

<title>Garmin CSV to Telegram pipeline</title>
<desc>Top-to-bottom flow of an 8-node n8n workflow: a Telegram message arrives, a CSV check routes non-CSV files to a rejection reply, CSV files are fetched from Telegram, sent to a FastAPI analyzer that uses Claude and PostgreSQL, and a Hebrew summary is built and sent back.</desc>
<rect class="box" x="40" y="10" width="260" height="46" rx="8"/>
<text class="lbl" x="170" y="31" text-anchor="middle">Telegram trigger</text>
<text class="sub" x="170" y="48" text-anchor="middle">new chat message</text>
<path class="arr" d="M170 56 V78"/>
<rect class="box" x="40" y="78" width="260" height="46" rx="8"/>
<text class="lbl" x="170" y="99" text-anchor="middle">IF: is it a CSV?</text>
<text class="sub" x="170" y="116" text-anchor="middle">file name ends in .csv</text>
<path class="arr" d="M300 101 H335"/>
<rect class="box" x="335" y="78" width="165" height="46" rx="8"/>
<text class="lbl" x="417" y="99" text-anchor="middle">Telegram: reject</text>
<text class="sub" x="417" y="116" text-anchor="middle">asks for a CSV</text>
<path class="arr" d="M170 124 V146"/>
<rect class="box" x="40" y="146" width="260" height="46" rx="8"/>
<text class="lbl" x="170" y="167" text-anchor="middle">HTTP: get file info</text>
<text class="sub" x="170" y="184" text-anchor="middle">Telegram Bot API</text>
<path class="arr" d="M170 192 V214"/>
<rect class="box" x="40" y="214" width="260" height="46" rx="8"/>
<text class="lbl" x="170" y="235" text-anchor="middle">HTTP: download CSV</text>
<text class="sub" x="170" y="252" text-anchor="middle">file content as text</text>
<path class="arr" d="M170 260 V282"/>
<rect class="box" x="40" y="282" width="260" height="46" rx="8"/>
<text class="lbl" x="170" y="303" text-anchor="middle">HTTP: analyze and save</text>
<text class="sub" x="170" y="320" text-anchor="middle">POST to internal service</text>
<path class="arr" d="M300 305 H335"/>
<rect class="store" x="335" y="282" width="165" height="46" rx="8"/>
<text class="lbl" x="417" y="303" text-anchor="middle">FastAPI service</text>
<text class="sub" x="417" y="320" text-anchor="middle">Claude + PostgreSQL</text>
<path class="arr" d="M170 328 V350"/>
<rect class="box" x="40" y="350" width="260" height="46" rx="8"/>
<text class="lbl" x="170" y="371" text-anchor="middle">Code: build message</text>
<text class="sub" x="170" y="388" text-anchor="middle">Hebrew summary text</text>
<path class="arr" d="M170 396 V418"/>
<rect class="box" x="40" y="418" width="260" height="46" rx="8"/>
<text class="lbl" x="170" y="439" text-anchor="middle">Telegram: confirm</text>
<text class="sub" x="170" y="456" text-anchor="middle">summary to same chat</text>
</svg>
